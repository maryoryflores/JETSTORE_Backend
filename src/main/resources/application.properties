spring.application.name=jetstore
server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/jetstore
spring.datasource.username=jetstore_admin
spring.datasource.password=1234

spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.jackson.default-property-inclusion=non_null

# --- Recuperación de contraseña ---
jetstore.frontend-url=${FRONTEND_URL:http://localhost:3000}
jetstore.recuperacion.expiracion-horas=${RECUPERACION_EXPIRACION_HORAS:1}
jetstore.correo.habilitado=${MAIL_HABILITADO:true}
jetstore.correo.remitente=${MAIL_REMITENTE:no-responder@jetstore.pe}

# --- Mercado Pago ---
mercadopago.access-token=${MERCADOPAGO_ACCESS_TOKEN:}
mercadopago.webhook-secret=${MERCADOPAGO_WEBHOOK_SECRET:}
mercadopago.notification-url=${MERCADOPAGO_NOTIFICATION_URL:http://localhost:8080/pago/webhook}
mercadopago.back-urls.success=${MERCADOPAGO_BACK_SUCCESS:http://localhost:3000/checkout/success}
mercadopago.back-urls.failure=${MERCADOPAGO_BACK_FAILURE:http://localhost:3000/checkout}
mercadopago.back-urls.pending=${MERCADOPAGO_BACK_PENDING:http://localhost:3000/checkout}

# --- SMTP (opcional) ---
# Para enviar correos reales configura en tu entorno las variables
# SPRING_MAIL_HOST, SPRING_MAIL_PORT, SPRING_MAIL_USERNAME y SPRING_MAIL_PASSWORD.
# Si no se configura SMTP, el enlace de recuperación se muestra en la consola del backend.
